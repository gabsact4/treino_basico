services:
  mongodb:
    image: mongo:8
    container_name: shady-store-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: shady-store-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/shady_store
      CLIENT_URL: http://localhost:5173
      SEED_DATABASE: "true"
    ports:
      - "3001:3001"

volumes:
  mongodb_data:
